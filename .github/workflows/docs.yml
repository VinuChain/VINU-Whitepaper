name: Docs

on:
  pull_request:
  push:
    branches:
      - Main

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check local docs links
        run: python scripts/check-docs-links.py
